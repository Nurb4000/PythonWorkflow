name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: workflow_user
          POSTGRES_PASSWORD: workflow_password
          POSTGRES_DB: workflow_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install ruff bandit
      - name: Lint (ruff)
        run: |
          cd backend
          ruff check app/ --select E,F,W,I --ignore E501
      - name: Security scan (bandit)
        run: |
          cd backend
          bandit -r app/ -ll --skip B101,B104
      - name: Run tests
        env:
          DATABASE_URL: postgresql+asyncpg://workflow_user:workflow_password@localhost:5432/workflow_db_test
          TEST_DATABASE_URL: postgresql+asyncpg://workflow_user:workflow_password@localhost:5432/workflow_db_test
        run: |
          cd backend
          python -m pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Security audit
        run: |
          cd frontend
          npm audit --production --audit-level=moderate || true

  docker-build:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Test Docker build
        run: |
          docker build -f Dockerfile.backend --target builder .
