services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-workflow_db}
      POSTGRES_USER: ${POSTGRES_USER:-workflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workflow_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workflow_user} -d ${POSTGRES_DB:-workflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "6000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://workflow_user:workflow_password@postgres:5432/workflow_db}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=True
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
      - ./knowledge-base:/app/knowledge-base
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "9000:80"
    depends_on:
      - backend

  # llama.cpp server (optional, for AI features)
  llama_cpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    command: -m /models/default.gguf --port 8080
    profiles:
      - ai

  # Mock LDAP server for testing (uncomment to use)
  # ldap-test:
  #   image: osixia/openldap:latest
  #   container_name: ldap-test
  #   environment:
  #     LDAP_ORGANIZATION: "Test Org"
  #     LDAP_DOMAIN: "test.example.com"
  #     LDAP_ADMIN_PASSWORD: "admin"
  #     LDAP_BASE_DN: "dc=test,dc=example,dc=com"
  #   ports:
  #     - "1389:389"
  #   volumes:
  #     - ./tests/ldap:/container/service/slapd/assets/config/bootstrap/ldif/custom
  #   command: ["--copy-service"]

volumes:
  postgres_data:
