version: '3.8'

services:
  # PostgreSQL Database (production)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: workflow_db
      POSTGRES_USER: workflow_user
      POSTGRES_PASSWORD: workflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SQLite Database (development)
  sqlite:
    image: python:3.11-slim
    command: >
      sh -c "python -m http.server 8000"
    volumes:
      - ./backend_data:/app/data
    working_dir: /app/data

  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      # Default to SQLite for easy development
      # Override with: DATABASE_URL=postgresql://user:pass@postgres:5432/db
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./workflow.db}
      - LLAMA_CPP_URL=http://llama_cpp:8081
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DEBUG=True
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    # Only depend on postgres if using PostgreSQL
    depends_on:
      postgres:
        condition: service_healthy
      sqlite:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # llama.cpp server (optional, for AI features)
  llama_cpp:
    image: ghcr.io/ggerganov/llama.cpp:server
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models
    command: -m /models/default.gguf --port 8080
    profiles:
      - ai

volumes:
  postgres_data:
  backend_data:
